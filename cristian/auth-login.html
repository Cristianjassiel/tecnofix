<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · TecnoFix Dolores</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800">
  <main class="mx-auto flex min-h-screen max-w-md flex-col justify-center p-4">
 
    <!-- Nombre del sistema  -->
    <header class="mb-6 text-center">
      <h1 class="text-2xl font-semibold">TecnoFix Dolores</h1>
      <p class="mt-1 text-sm text-stone-500">Sistema de servicio técnico de electrónicos</p>
    </header>
 
    <section class="rounded-xl border border-stone-200 bg-white p-6 shadow-sm">
      <h2 class="text-xl font-semibold">Iniciar sesión</h2>
 
      <!-- Zona de alerta: bloqueo temporal por intentos fallidos. -->
      <div id="alerta" role="alert" class="hidden mt-4 rounded-lg bg-red-100 p-3 text-sm text-red-800">
        Tu cuenta se bloqueó temporalmente por varios intentos fallidos de inicio de sesión. Vuelve a intentarlo más tarde.
      </div>
 
      <form action="#" method="post" class="mt-4 space-y-4">
        <div>
          <label for="usuario" class="block text-sm text-stone-500">Usuario o correo electrónico</label>
          <input
            id="usuario"
            name="usuario"
            type="text"
            autocomplete="username"
            class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-indigo-500 focus:outline-none"
            required
          >
        </div>
 
        <div>
          <label for="password" class="block text-sm text-stone-500">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-indigo-500 focus:outline-none"
            required
          >
        </div>
 
        <button
          type="submit"
          class="w-full rounded-lg bg-indigo-600 px-5 py-2 text-sm font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        >
          Iniciar sesión
        </button>
      </form>
 
      <p class="mt-4 text-center text-sm">
        <a href="../bryan/auth-recuperar-password.html" class="text-indigo-700 hover:text-indigo-600">¿Olvidaste tu contraseña?</a>
      </p>
    </section>
 
  </main>
</body>
</html>

<nav aria-label="Paginación" class="flex gap-4 items-center py-4">{% if page_obj.has_previous %}<a href="?{{ filtros }}&q={{ q|urlencode }}&page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}<span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} resultados</span>{% if page_obj.has_next %}<a href="?{{ filtros }}&q={{ q|urlencode }}&page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}</nav>

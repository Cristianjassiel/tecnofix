<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - TecnoFix Dolores</title>
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 flex items-center justify-center min-h-screen">

    <!-- Tarjeta / Sección -->
    <section class="w-full max-w-md rounded-xl border border-stone-200 bg-white p-6 shadow-sm mx-4">

        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-stone-800">TecnoFix Dolores</h1>
            <h2 class="text-xl font-semibold text-stone-800 mt-2">Restablecer contraseña</h2>
            <p class="text-sm text-stone-500 mt-2">Escribe el codigo para Restablecer la contraseña.</p>
        </div>

        <form action="#" method="POST" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-stone-800">Codigo:</label>
                <!-- Input con clases de foco -->
                <input type="email" id="email" name="email" required placeholder="ejemplo 111-111"
                    class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-indigo-500 focus:outline-none text-stone-800 placeholder-stone-400">
            </div>

            <!-- Botón primario -->
            <button type="submit"
                class="w-full rounded-lg bg-indigo-600 px-5 py-2 text-sm font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                Enviar enlace de recuperación
            </button>
        </form>

        <div class="mt-6 text-center">
            <!-- Link normal -->
            <a href="login.html" class="text-sm text-stone-500 hover:text-indigo-600 transition">
                Volver al inicio de sesión
            </a>
        </div>

    </section>

</body>
</html>

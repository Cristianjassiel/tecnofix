<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta / Edición de Cliente - TecnoFix Dolores</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 p-4 md:p-8">

    <main class="mx-auto max-w-3xl mt-6">

        <!-- Encabezado de la página -->
        <div class="mb-6 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-stone-800">Gestión de Clientes</h1>
                <p class="text-sm text-stone-500 mt-1">Registra un nuevo cliente o actualiza su información de contacto.</p>
            </div>
            <!-- Link con color de marca activo -->
            <a href="#" class="text-sm font-medium text-indigo-700 hover:text-indigo-600 transition">
                Volver a la lista
            </a>
        </div>

        <!-- Tarjeta del Formulario -->
        <section class="rounded-xl border border-stone-200 bg-white p-6 shadow-sm">
            <form action="#" method="POST" class="space-y-6">

                <div class="grid grid-cols-1 gap-6 md:grid-cols-2">

                    <!-- Campo: Nombre Completo -->
                    <div class="md:col-span-2">
                        <label for="nombre" class="block text-sm font-medium text-stone-800">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez"
                            class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-indigo-500 focus:outline-none text-stone-800">
                    </div>

                    <!-- Campo: Teléfono -->
                    <div>
                        <label for="telefono" class="block text-sm font-medium text-stone-800">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" required placeholder="Ej. 418 123 4567"
                            class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-indigo-500 focus:outline-none text-stone-800">
                    </div>

                    <!-- Campo: Correo Electrónico -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-stone-800">Correo electrónico</label>
                        <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com"
                            class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-indigo-500 focus:outline-none text-stone-800">
                    </div>

                    <!-- Campo: Dirección -->
                    <div class="md:col-span-2">
                        <label for="direccion" class="block text-sm font-medium text-stone-800">Dirección</label>
                        <input type="text" id="direccion" name="direccion" placeholder="Calle, Número, Colonia"
                            class="mt-1 w-full rounded-lg border border-stone-300 p-2 focus:border-indigo-500 focus:outline-none text-stone-800">
                    </div>

                </div>

                <!-- Botones de Acción -->
                <div class="flex items-center justify-end gap-4 border-t border-stone-200 pt-6 mt-6">
                    <button type="button" class="px-5 py-2 text-sm font-medium text-stone-500 hover:text-stone-800 transition">
                        Cancelar
                    </button>
                    <!-- Botón primario -->
                    <button type="submit"
                        class="rounded-lg bg-indigo-600 px-5 py-2 text-sm font-medium text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                        Guardar Cliente
                    </button>
                </div>

            </form>
        </section>

    </main>

</body>
</html>
